name: Publicar catálogo
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar archivos públicos
        run: |
          mkdir public-site
          cp index.html public-site/index.html
          touch public-site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
